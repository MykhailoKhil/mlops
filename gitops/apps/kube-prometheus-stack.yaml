apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.0.0
    helm:
      valuesObject:
        # kind control-plane components are not scrapeable; avoid permanently-down targets
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        # shortcut: no Alertmanager to save RAM on 8 GB; enable when we add drift alerts
        alertmanager:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 2d
            # pick up ServiceMonitors from any namespace (our serving app lives in mlops)
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            resources:
              requests:
                memory: 400Mi
              limits:
                memory: 1Gi
        grafana:
          # lab-only credentials
          adminPassword: admin123
          resources:
            requests:
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRDs are too large for client-side apply (annotation size limit)
      - ServerSideApply=true
