apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    # shortcut: upstream MinIO removed its public images, so we use frozen
    # bitnamilegacy ones (no security updates); swap to a maintained S3 store before anything real
    repoURL: registry-1.docker.io/bitnamicharts
    chart: minio
    targetRevision: 17.0.21
    helm:
      valuesObject:
        global:
          security:
            allowInsecureImages: true
        image:
          repository: bitnamilegacy/minio
        console:
          image:
            repository: bitnamilegacy/minio-object-browser
        mode: standalone
        # lab-only credentials; replace with a Secret before anything real
        auth:
          rootUser: minioadmin
          rootPassword: minioadmin123
        defaultBuckets: mlflow
        persistence:
          size: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
