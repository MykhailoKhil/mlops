apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default
  source:
    # shortcut: frozen bitnamilegacy image (no security updates); fine for the lab
    repoURL: registry-1.docker.io/bitnamicharts
    chart: postgresql
    targetRevision: 16.7.27
    helm:
      valuesObject:
        global:
          security:
            allowInsecureImages: true
        image:
          repository: bitnamilegacy/postgresql
        # lab-only credentials; replace with a Secret before anything real
        auth:
          username: mlflow
          password: mlflow123
          database: mlflow
        primary:
          persistence:
            size: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
