apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          # built and pushed by the build-images workflow; the tag is the commit SHA and a PR bumps it
          image: ghcr.io/mykhailokhil/mlops-mlflow:f2a8e66
          imagePullPolicy: IfNotPresent
          command: ["mlflow", "server"]
          args:
            - --host=0.0.0.0
            - --port=5000
            # default is 4 workers, each importing sklearn/pandas; that alone exceeds the 1Gi limit
            - --workers=1
            # explicit driver: SQLAlchemy 2.1 defaults plain postgresql:// to psycopg v3, which we don't install
            - --backend-store-uri=postgresql+psycopg2://mlflow:$(DB_PASSWORD)@postgres-postgresql:5432/mlflow
            - --artifacts-destination=s3://mlflow
            - --serve-artifacts
            # default only allows localhost + private IPs; in-cluster DNS names would get 403
            - --allowed-hosts=mlflow*,localhost*,127.0.0.1*
          env:
            # jobs subsystem spawns a runner + 5 huey consumers (~1.5 GiB total); we only need tracking/registry
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-postgresql
                  key: password
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: root-password
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
