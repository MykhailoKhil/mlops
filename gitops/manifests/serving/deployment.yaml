apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serving
  template:
    metadata:
      labels:
        app: serving
    spec:
      containers:
        - name: serving
          # built locally and loaded with `kind load docker-image`, not pulled from a registry
          image: mlops-serving:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
          ports:
            - name: http
              containerPort: 8000
          # readiness only: a liveness probe would restart-loop the pod whenever MLflow is briefly down
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 768Mi
